<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Qualifica Vix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            color-scheme: dark;
            --bg: #030712;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.6);
            --danger: #f87171;
            --success: #34d399;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
            color: var(--text);
            background:
                linear-gradient(135deg, rgba(3, 7, 18, 0.88), rgba(7, 17, 31, 0.85), rgba(15, 23, 42, 0.9)),
                url("/imagem/terceira_ponte.png") center bottom / cover no-repeat fixed;
            display: grid;
            place-items: center;
            overflow-x: clip;
            min-height: 100dvh;
            padding: 24px 16px;
            position: relative;
        }

        /* Glassmorphism card */
        .glass-card {
            width: min(420px, calc(100vw - 32px));
            padding: 44px 36px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: rgba(10, 18, 36, 0.45);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 2;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
        }

        .logo-img {
            height: 48px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            transition: transform 0.3s;
        }

        .logo-img:hover {
            transform: scale(1.04);
        }

        .logo-divider {
            width: 1px;
            height: 36px;
            background: rgba(255, 255, 255, 0.15);
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1.15rem;
            transition: color 0.25s;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 16px 15px 46px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--input-bg);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: all 0.25s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-light);
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
        }

        .input-wrapper input:focus + i {
            color: var(--primary-light);
        }

        .button {
            border: 0;
            border-radius: 14px;
            padding: 15px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.2);
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(124, 58, 237, 0.3);
            filter: brightness(1.15);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            font-size: 0.88rem;
            text-align: center;
            min-height: 22px;
            transition: color 0.2s;
            width: 100%;
        }

        .status.error { color: var(--danger); }
        .status.success { color: var(--success); }
        .status.info { color: var(--muted); }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            z-index: 1;
            pointer-events: none;
            animation: pulse 10s ease-in-out infinite alternate;
        }
        .orb-1 { width: 320px; height: 320px; background: var(--primary); top: 15%; left: 20%; }
        .orb-2 { width: 280px; height: 280px; background: #3b82f6; bottom: 15%; right: 20%; animation-delay: -4s; }

        @keyframes pulse {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.08); }
        }
        @media (max-width: 480px) {
            .glass-card { padding: 28px 20px; }
            .logo-container { gap: 10px; }
            .logo-divider { flex-shrink: 0; }
            .orb { display: none; }
        }
        .login-help { color: var(--muted); font-size: 13px; line-height: 1.5; text-align: center; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <main class="glass-card">
        <div class="logo-container">
            <img src="/imagem/qualifica-vix.svg" alt="Qualifica Vix" class="logo-img">
            <div class="logo-divider"></div>
            <img src="/imagem/prefeitura.png" alt="Prefeitura de Vitória" class="logo-img">
        </div>

        <p class="login-help">Acesso administrativo com sua conta do Firebase Authentication.</p>
        <form id="loginForm" autocomplete="off">
            <div class="input-group">
                <div class="input-wrapper">
                    <input id="username" name="username" type="email" placeholder="E-mail do administrador" autocomplete="username" aria-label="E-mail do administrador" required>
                    <i class="bi bi-person"></i>
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <input id="password" name="password" type="password" placeholder="Senha" autocomplete="current-password" aria-label="Senha" required>
                    <i class="bi bi-lock"></i>
                </div>
            </div>

            <button class="button" id="submitBtn" type="submit">
                Entrar
            </button>
        </form>

        <div class="status" id="statusMsg" aria-live="polite"></div>
    </main>

    <script type="module" src="/src/admin/login.ts"></script>
</body>
</html>
