<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Qualifica Vix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            color-scheme: light;
            --bg: #f7f9fd;
            --text: #24365a;
            --muted: #5f6f86;
            --primary: #2e64bd;
            --primary-light: #2e64bd;
            --border: #dde5ef;
            --input-bg: #ffffff;
            --danger: #b91c1c;
            --success: #146844;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 20% 10%, #eee8f6, transparent 40%), radial-gradient(circle at 85% 80%, #e7f1ef, transparent 35%), #f7f9fd;
            display: grid;
            place-items: center;
            overflow-x: clip;
            min-height: 100dvh;
            padding: 24px 16px;
            position: relative;
        }

        /* Glassmorphism card */
        .glass-card {
            width: min(420px, calc(100vw - 32px));
            padding: 44px 36px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: #ffffff;
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            box-shadow: 
                0 30px 60px rgba(40, 62, 105, 0.1),
                inset 0 1px 1px #dde5ef;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 2;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
        }

        .logo-img {
            height: auto;
            width: min(45%, 180px);
            max-height: 120px;
            min-width: 0;
            object-fit: contain;
            filter: none;
            transition: transform 0.3s;
        }

        .logo-img:hover {
            transform: scale(1.04);
        }

        .logo-divider {
            width: 1px;
            height: 36px;
            background: #dde5ef;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1.15rem;
            transition: color 0.25s;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 16px 15px 46px;
            border-radius: 14px;
            border: 1px solid #dde5ef;
            background: var(--input-bg);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: all 0.25s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-light);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(46, 100, 189, 0.15);
        }

        .input-wrapper input:focus + i {
            color: var(--primary-light);
        }

        .button {
            border: 0;
            border-radius: 14px;
            padding: 15px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, var(--primary), #283e69);
            box-shadow: 0 10px 20px rgba(46, 100, 189, 0.2);
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(46, 100, 189, 0.3);
            filter: brightness(1.15);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            font-size: 0.88rem;
            text-align: center;
            min-height: 22px;
            transition: color 0.2s;
            width: 100%;
        }

        .status.error { color: var(--danger); }
        .status.success { color: var(--success); }
        .status.info { color: var(--muted); }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.08;
            z-index: 1;
            pointer-events: none;
            animation: pulse 10s ease-in-out infinite alternate;
        }
        .orb-1 { width: 320px; height: 320px; background: var(--primary); top: 15%; left: 20%; }
        .orb-2 { width: 280px; height: 280px; background: #3b82f6; bottom: 15%; right: 20%; animation-delay: -4s; }

        @keyframes pulse {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.08); }
        }
        @media (max-width: 480px) {
            .glass-card { padding: 28px 20px; }
            .logo-container { gap: 10px; }
            .logo-divider { flex-shrink: 0; }
            .orb { display: none; }
        }
        .login-help { color: var(--muted); font-size: 13px; line-height: 1.5; text-align: center; }
        .municipal-logo { width: 180px; max-height: 58px; }
        .logo-container { flex-direction: column; gap: 4px; }
        .logo-divider { display: none; }
        .qualifica-logo { width: 220px; max-width: 100%; }
        .glass-card { gap: 22px; }
        @media (prefers-reduced-motion: reduce) { .orb, .glass-card { animation: none; } }
    </style>
    <link rel="icon" type="image/png" href="/imagem/logo.png">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <main class="glass-card">
        <div class="logo-container">
            <img src="/imagem/logo.png" alt="Qualifica Vix" class="logo-img qualifica-logo">
            <div class="logo-divider"></div>
            <img src="/imagem/prefeitura-preto-transparente.png" alt="Prefeitura de Vitória" class="logo-img municipal-logo">
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="input-group">
                <div class="input-wrapper">
                    <input id="username" name="username" type="email" placeholder="E-mail do administrador" autocomplete="username" aria-label="E-mail do administrador" required>
                    <i class="bi bi-person"></i>
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <input id="password" name="password" type="password" placeholder="Senha" autocomplete="current-password" aria-label="Senha" required>
                    <i class="bi bi-lock"></i>
                </div>
            </div>

            <button class="button" id="submitBtn" type="submit">
                Entrar
            </button>
        </form>

        <div class="status" id="statusMsg" aria-live="polite"></div>
    </main>

    <script type="module" src="/src/admin/login.ts"></script>
</body>
</html>
